map $http_x_forwarded_proto $lumio_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  server_tokens off;
  client_max_body_size 64k;
  root /usr/share/nginx/html;
  index index.html;
  # Docker DNS: resolve core again after a deployment changes its container IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $lumio_backend http://lm-core:8080;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.csr.html; }
  location = /sitemap.xml { try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }
  location = /static-build.json { return 404; }
  location ~* \.(css|js|mjs|map|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
    try_files $uri =404;
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location ^~ /catalog-media/ {
    proxy_pass $lumio_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $lumio_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location = /graphql {
    proxy_pass $lumio_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $lumio_forwarded_proto;
    proxy_read_timeout 120s;
  }
}
