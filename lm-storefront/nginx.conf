server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.csr.html; }
  location = /sitemap.xml { try_files $uri =404; }
  location = /robots.txt { try_files $uri =404; }
  location = /static-build.json { return 404; }
  location ~* \.(css|js|mjs|map|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
    try_files $uri =404;
  }
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location ^~ /catalog-media/ {
    proxy_pass http://lm-core:8080;
    proxy_set_header Host $host;
  }
  location = /graphql {
    proxy_pass http://lm-core:8080/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
