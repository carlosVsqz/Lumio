<article class="group h-full" [attr.aria-labelledby]="'item-' + item().id">
  <div class="relative">
  <a class="block aspect-[4/5] overflow-hidden bg-image" [routerLink]="['/catalogo', item().slug]" [attr.aria-label]="'Ver ' + item().name" tabindex="-1" aria-hidden="true">
    <app-product-image [image]="item().images[0] ?? null" [label]="item().name" [priority]="priority()" />
  </a>
  <app-favorite-button class="absolute top-2 right-2" [itemId]="item().id" [catalogId]="catalog().id" [descriptionId]="'item-' + item().id" (removed)="favoriteRemoved.emit()" />
  <button type="button" class="quick-view-trigger absolute bottom-2 left-2 inline-flex min-h-11 max-w-[calc(100%-1rem)] items-center gap-2 rounded-full bg-surface/95 px-3 py-2 text-xs font-semibold text-ink hover:bg-surface" aria-haspopup="dialog" [attr.aria-label]="'Vista rápida de ' + item().name" (click)="openQuickView($event)"><app-ui-icon name="eye" [size]="16" /> Vista rápida</button>
  </div>
  <div class="pt-4 pb-7">
    <h2 class="text-sm font-semibold leading-6 sm:text-base" [id]="'item-' + item().id"><a class="hover:underline underline-offset-4" [routerLink]="['/catalogo', item().slug]">{{ item().name }}</a></h2>
    <p class="mt-1 text-xs leading-5 text-muted sm:text-sm">{{ categories() || (item().type === 'SERVICE' ? 'Servicio' : 'Producto') }}</p>
    @if (item().variants.length > 1) { <p class="mt-1 text-xs text-muted sm:text-sm">{{ item().variants.length }} variantes</p> }
    <p class="mt-3 text-sm font-semibold tabular-nums sm:text-base">@if (variedPrice()) { <span class="mr-1 font-normal">Desde</span> }{{ price() }}</p>
    @if (!available()) { <p class="mt-2 text-xs font-medium text-unavailable-ink">No disponible</p> }
  </div>
</article>
