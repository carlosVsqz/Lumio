# Un único deploy: database -> bootstrap -> Odoo -> Java -> build estático -> Nginx.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-odoo-environment: &odoo-environment
  HOST: odoo-db
  PORT: "5432"
  USER: ${ODOO_DB_USER:-lumio_odoo}
  PASSWORD: ${ODOO_DB_PASSWORD:?Configure ODOO_DB_PASSWORD}
  ODOO_DATABASE: ${ODOO_DATABASE:?Configure ODOO_DATABASE}
  ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?Configure ODOO_MASTER_PASSWORD}
  ODOO_WORKERS: ${ODOO_WORKERS:-2}
  ODOO_CRON_THREADS: ${ODOO_CRON_THREADS:-1}
  ODOO_WORKER_MEMORY_SOFT: ${ODOO_WORKER_MEMORY_SOFT:-536870912}
  ODOO_WORKER_MEMORY_HARD: ${ODOO_WORKER_MEMORY_HARD:-805306368}

services:
  odoo-db:
    networks: [backend]
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-lumio_db_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configure POSTGRES_ADMIN_PASSWORD}
      ODOO_DB_USER: ${ODOO_DB_USER:-lumio_odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?Configure ODOO_DB_PASSWORD}
      ODOO_DATABASE: ${ODOO_DATABASE:?Configure ODOO_DATABASE}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    configs:
      - source: odoo-db-init
        target: /docker-entrypoint-initdb.d/10-lumio.sh
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${POSTGRES_MEMORY:-512m}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 60s

  odoo-init:
    networks: [backend]
    build:
      context: ./infrastructure/odoo
    command: [python3, /opt/lumio/bootstrap.py]
    environment:
      <<: *odoo-environment
      ODOO_ADMIN_LOGIN: ${ODOO_ADMIN_LOGIN:-lumio-admin}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Configure ODOO_ADMIN_PASSWORD}
      LUMIO_BUSINESS_NAME: ${LUMIO_BUSINESS_NAME:-Lumio}
      LUMIO_CURRENCY: ${LUMIO_CURRENCY:-GTQ}
      ODOO_PUBLIC_URL: ${ODOO_PUBLIC_URL:?Configure ODOO_PUBLIC_URL}
      # Optional overrides; empty means discover/generate in THIS database.
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_WEBSITE_ID: ${ODOO_WEBSITE_ID:-}
      ODOO_PRICELIST_ID: ${ODOO_PRICELIST_ID:-}
      ODOO_WAREHOUSE_ID: ${ODOO_WAREHOUSE_ID:-}
    depends_on:
      odoo-db:
        condition: service_healthy
    group_add: ["11000"]
    volumes:
      - odoo-web-data:/var/lib/odoo
      - catalog-integration:/var/lib/lumio-integration
    healthcheck:
      disable: true
    mem_limit: ${ODOO_MEMORY:-2g}
    restart: "no"
    logging: *logging

  odoo:
    networks: [backend]
    build:
      context: ./infrastructure/odoo
    environment: *odoo-environment
    depends_on:
      odoo-init:
        condition: service_completed_successfully
      odoo-db:
        condition: service_healthy
    expose: ["8069", "8072"]
    volumes:
      - odoo-web-data:/var/lib/odoo
    mem_limit: ${ODOO_MEMORY:-2g}
    shm_size: 256m
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 60s

  lm-core:
    networks: [backend]
    build:
      context: .
      dockerfile: lm-core/Dockerfile
    environment:
      CATALOG_PROVIDER: odoo
      CATALOG_BRAND_ATTRIBUTE: ${CATALOG_BRAND_ATTRIBUTE:-Marca}
      LUMIO_CATALOG_ID: ${LUMIO_CATALOG_ID:?Configure a stable production catalog ID}
      LUMIO_LOGO_URL: ${LUMIO_LOGO_URL:-}
      LUMIO_PRIMARY_COLOR: ${LUMIO_PRIMARY_COLOR:-}
      LUMIO_SETTINGS_FILE: /run/lumio/catalog.properties
      GRAPHIQL_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ODOO_URL: http://odoo:8069
      ODOO_DATABASE: ${ODOO_DATABASE:?Configure ODOO_DATABASE}
      ODOO_STOCK_POLICY: ${ODOO_STOCK_POLICY:-FREE_STOCK}
      ODOO_LANGUAGE: ${ODOO_LANGUAGE:-es_ES}
      ODOO_CAMPAIGNS_ENABLED: ${ODOO_CAMPAIGNS_ENABLED:-true}
      ODOO_BUSINESS_NAME: ${ODOO_BUSINESS_NAME:-}
      ODOO_BUSINESS_DESCRIPTION: ${ODOO_BUSINESS_DESCRIPTION:-}
      ODOO_WHATSAPP_NUMBER: ${ODOO_WHATSAPP_NUMBER:-}
      ODOO_CONNECT_TIMEOUT_MS: ${ODOO_CONNECT_TIMEOUT_MS:-3000}
      ODOO_REQUEST_TIMEOUT_MS: ${ODOO_REQUEST_TIMEOUT_MS:-10000}
      ODOO_MAX_RECORDS: ${ODOO_MAX_RECORDS:-5000}
      ODOO_MAX_IMAGE_BYTES: ${ODOO_MAX_IMAGE_BYTES:-4000000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
    depends_on:
      odoo-init:
        condition: service_completed_successfully
        restart: true
      odoo:
        condition: service_healthy
    group_add: ["11000"]
    volumes:
      - type: volume
        source: catalog-integration
        target: /run/lumio
        read_only: true
        volume:
          nocopy: true
    expose: ["8080"]
    mem_limit: ${LUMIO_CORE_MEMORY:-768m}
    init: true
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s

  storefront-build:
    networks: [backend]
    build:
      context: .
      dockerfile: infrastructure/dokploy/Dockerfile.storefront
      target: build-tools
    environment:
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Configure the HTTPS storefront origin}
      CATALOG_BUILD_API_URL: http://lm-core:8080/graphql
      STATIC_OUTPUT_DIRECTORY: /static
      NODE_OPTIONS: --max-old-space-size=${LUMIO_BUILD_HEAP_MB:-1024}
      NG_BUILD_MAX_WORKERS: ${LUMIO_BUILD_WORKERS:-1}
      NG_BUILD_PARALLEL_TS: "0"
    depends_on:
      lm-core:
        condition: service_healthy
    volumes:
      - storefront-static:/static
    mem_limit: ${LUMIO_BUILD_MEMORY:-2g}
    cpus: ${LUMIO_BUILD_CPUS:-1.0}
    init: true
    restart: "no"
    logging: *logging

  lm-storefront:
    networks: [backend]
    build:
      context: .
      dockerfile: infrastructure/dokploy/Dockerfile.storefront
      target: storefront
    depends_on:
      storefront-build:
        condition: service_completed_successfully
      lm-core:
        condition: service_healthy
    volumes:
      - type: volume
        source: storefront-static
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
    expose: ["80"]
    mem_limit: ${LUMIO_STOREFRONT_MEMORY:-128m}
    restart: unless-stopped
    logging: *logging

networks:
  # Explicit membership survives domain services receiving an additional Dokploy network.
  # Compose scopes the bridge and service DNS aliases to the application project.
  backend:
    driver: bridge

volumes:
  odoo-db-data:
  odoo-web-data:
  catalog-integration:
  storefront-static:

configs:
  # No secret here: values come from the database container environment.
  odoo-db-init:
    content: |
      #!/bin/sh
      set -eu
      : "$${ODOO_DB_USER:?Missing ODOO_DB_USER}"
      : "$${ODOO_DB_PASSWORD:?Missing ODOO_DB_PASSWORD}"
      : "$${ODOO_DATABASE:?Missing ODOO_DATABASE}"
      psql --username "$${POSTGRES_USER}" --dbname postgres --set ON_ERROR_STOP=1 \
        --set app_user="$${ODOO_DB_USER}" --set app_password="$${ODOO_DB_PASSWORD}" \
        --set app_db="$${ODOO_DATABASE}" <<'SQL'
      CREATE ROLE :"app_user" LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
      CREATE DATABASE :"app_db" OWNER :"app_user";
      SQL
