services:
  lm-core:
    build:
      context: .
      dockerfile: lm-core/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CATALOG_PROVIDER: ${CATALOG_PROVIDER:-json}
      LUMIO_CATALOG_ID: ${LUMIO_CATALOG_ID:-}
      LUMIO_LOGO_URL: ${LUMIO_LOGO_URL:-}
      LUMIO_PRIMARY_COLOR: ${LUMIO_PRIMARY_COLOR:-}
      CATALOG_LOCATION: ${CATALOG_LOCATION:-file:/catalog/example.json}
      ODOO_URL: ${ODOO_URL:-http://odoo:8069}
      ODOO_DATABASE: ${ODOO_DATABASE:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_WEBSITE_ID: ${ODOO_WEBSITE_ID:-0}
      ODOO_PRICELIST_ID: ${ODOO_PRICELIST_ID:-0}
      ODOO_WAREHOUSE_ID: ${ODOO_WAREHOUSE_ID:-0}
      ODOO_STOCK_POLICY: ${ODOO_STOCK_POLICY:-FREE_STOCK}
      ODOO_LANGUAGE: ${ODOO_LANGUAGE:-en_US}
      ODOO_CAMPAIGNS_ENABLED: ${ODOO_CAMPAIGNS_ENABLED:-false}
      ODOO_BUSINESS_NAME: ${ODOO_BUSINESS_NAME:-}
      ODOO_BUSINESS_DESCRIPTION: ${ODOO_BUSINESS_DESCRIPTION:-}
      ODOO_WHATSAPP_NUMBER: ${ODOO_WHATSAPP_NUMBER:-}
      ODOO_CONNECT_TIMEOUT_MS: ${ODOO_CONNECT_TIMEOUT_MS:-3000}
      ODOO_REQUEST_TIMEOUT_MS: ${ODOO_REQUEST_TIMEOUT_MS:-10000}
      ODOO_MAX_RECORDS: ${ODOO_MAX_RECORDS:-5000}
      ODOO_MAX_IMAGE_BYTES: ${ODOO_MAX_IMAGE_BYTES:-4000000}
    volumes:
      - ${CATALOG_DIRECTORY:-./lm-core/src/main/resources/catalog}:/catalog:ro
    restart: unless-stopped
  odoo:
    image: odoo:19.0
    profiles: [odoo]
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    environment:
      HOST: odoo-db
      PORT: "5432"
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-}
    command:
      - odoo
      - --proxy-mode
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/lumio-addons
      # Mantiene los addons existentes y añade los módulos de Lumio.
      - --data-dir=/var/lib/odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./infrastructure/odoo/addons:/mnt/lumio-addons:ro
      - type: bind
        source: ${ODOO_CONFIG_DIRECTORY:-../files/config}
        target: /etc/odoo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ODOO_ADDONS_DIRECTORY:-../files/addons}
        target: /mnt/extra-addons
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
  odoo-db:
    image: postgres:17
    profiles: [odoo]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  lm-storefront:
    # Primero ejecutar npm run build:storefront con lm-core activo.
    # La imagen empaqueta el artefacto estático verificado; no compila ni ejecuta Node.
    build: ./lm-storefront
    ports:
      - "8088:80"
    depends_on:
      - lm-core
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data:
